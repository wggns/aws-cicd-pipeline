<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WGGN Text to Speech (AWS Polly)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 40px;
      background: #f8f8f8;
    }
    textarea {
      width: 80%;
      height: 120px;
      margin-top: 10px;
      font-size: 16px;
    }
    #status {
      color: red;
      margin-top: 10px;
      font-weight: bold;
    }
    audio {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Text → Speech (AWS Polly)</h1>
  <label>Voice:
    <input id="voice" type="text" value="Joanna">
  </label>
  <br><br>
  <textarea id="text" placeholder="Write something here..."></textarea>
  <br>
  <button id="speak">Speak</button>
  <p id="status"></p>
  <audio id="player" controls></audio>

  <script>
    // ✅ Replace with your actual API Gateway Invoke URL
    const endpoint = "https://pgrtwbnqog.execute-api.us-east-1.amazonaws.com/narrator";

    const el = {
      voice:  document.getElementById('voice'),
      text:   document.getElementById('text'),
      status: document.getElementById('status'),
      player: document.getElementById('player'),
      speak:  document.getElementById('speak'),
    };

    el.speak.onclick = async () => {
      el.status.textContent = "Synthesizing...";
      const text = (el.text.value || "").trim().slice(0, 3000);
      const voice = (el.voice.value || "Joanna").trim();

      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, voice })
        });

        if (!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);

        // Expect MP3 blob, not JSON
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        el.player.src = url;
        await el.player.play();
        el.status.textContent = "Done.";
      } catch (e) {
        console.error(e);
        el.status.textContent = "Error: " + e.message;
      }
    };
  </script>

</body>
</html>
